# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Idioma de revisión en español obligatorio
language: "es"

reviews:
  profile: "assertive"
  
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"

  # 10 Reglas de negocio, arquitectura hexagonal, seguridad, concurrencia y resiliencia
  path_instructions:
    - path: "src/main/java/**/domain/**"
      instructions: |
        Regla 7 (Arquitectura Hexagonal y DDD Puro):
        - PROHIBIDO: Instanciar clientes de red o I/O directo dentro de clases de dominio (ej. java.net.http.HttpClient, HttpURLConnection, sockets).
        - PROHIBIDO: Leer variables de entorno del sistema operativo (System.getenv, System.getProperty) en entidades o Value Objects.
        - PROHIBIDO: Importar frameworks o persistencia (@Entity, @Table, @Id de jakarta.persistence, o @Component, @Service de Spring).
        - El dominio debe ser Java puro. Toda comunicación externa debe abstraerse mediante Puertos de Salida (Output Ports).

    - path: "src/main/java/**/application/**"
      instructions: |
        Reglas 1 y 2 (Invariantes de Reembolso y Divisas):
        - PROHIBIDO: Permitir montos de reembolso negativos o menores/iguales a cero (inyección fraudulenta de saldo).
        - PROHIBIDO: Procesar reembolsos que superen el importe total original de la transacción.
        - PROHIBIDO: Arbitraje de divisas sin conversión oficial (forzar tasa 1:1 entre EUR y USD). Exigir validación estricta del Value Object Money.

    - path: "src/main/java/**/adapter/out/cache/**"
      instructions: |
        Reglas 3 y 4 (Concurrencia en Spring y Thread-Safety):
        - PROHIBIDO: Colecciones estáticas mutables (ej. private static final Map<...> = new HashMap<>()) en Beans Singleton de Spring por riesgo de Race Conditions y Memory Leaks.
        - PROHIBIDO: Compartir instancias de SimpleDateFormat entre hilos (no es thread-safe). Exigir DateTimeFormatter.

    - path: "src/main/java/**/adapter/out/gateway/**"
      instructions: |
        Reglas 8 y 9 (Resiliencia y PCI-DSS):
        - PROHIBIDO: Bucles infinitos de reintento while(true) o while(!success) sin retroceso exponencial (backoff), sin timeout y sin límite máximo de intentos (riesgo crítico de Thread Pool Starvation).
        - PROHIBIDO: Imprimir números de tarjeta de crédito completos (PAN de 16 dígitos) o CVV en los logs de aplicación sin enmascaramiento adecuado.

    - path: "src/main/java/**/adapter/in/web/**"
      instructions: |
        Reglas 5, 6 y 10 (Seguridad Web, Webhooks y Persistencia):
        - PROHIBIDO: Claves de API privadas de producción hardcodeadas (ej. sec_live_..., whsec_...). Exigir configuración externa segura.
        - PROHIBIDO: Bypasses en validación criptográfica de webhooks (ej. retornar true si la firma es nula o vacía) o usar .equals() directo susceptible a Timing Attacks en lugar de MessageDigest.isEqual().
        - PROHIBIDO: Recibir o retornar clases @Entity de JPA en controladores REST. Exigir siempre DTOs.
        - PROHIBIDO: Concatenar sentencias SQL o inyectar JdbcTemplate en controladores (@RestController) con riesgo crítico de SQL Injection.
